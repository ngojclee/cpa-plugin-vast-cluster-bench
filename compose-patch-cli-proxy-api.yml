# ================================================================
# BỔ SUNG cho cli-proxy-api trong compose vast-cpa — phần VAST CLUSTER BENCH
#
# Chèn vào service cli-proxy-api (mục 3 trong file compose):
#   1) environment: VAST_API_KEY + VAST_TUNNEL_DIR
#   2) volumes: mount thư mục tunnel (/home/Docker/vast-tunnel)
#
# VAST_TUNNEL_DIR trỏ tới THƯ MỤC tunnel (không phải từng file):
#   - instances.txt  → plugin tự quét node từ tunnel (auto-discover)
#   - ssh/id_ed25519 → plugin tự dò key SSH dùng chung với tunnel
# ================================================================

# --- TRONG service: cli-proxy-api ---------------------------------

    environment:
      TZ: "${TZ:-Europe/Paris}"
      MANAGEMENT_PASSWORD: "${MANAGEMENT_PASSWORD}"
      OPENCODEX_DEVICE_ID_PATH: "${OPENCODEX_DEVICE_ID_PATH:-/data/opencodex/device-id}"
      CPA_PLUGIN_GITHUB_TOKEN: "${CPA_PLUGIN_GITHUB_TOKEN:-}"
      CPA_CODEX_COMPACTION_KEY: "${CPA_CODEX_COMPACTION_KEY:-}"
      # >>> VAST CLUSTER BENCH (thêm 2 dòng này) <<<
      VAST_API_KEY: "${VAST_API_KEY}"
      VAST_TUNNEL_DIR: "/vast-tunnel"

    volumes:
      - /home/Docker/CLIProxyAPI/config.yaml:/CLIProxyAPI/config.yaml:rw
      - /home/Docker/CLIProxyAPI/.cli-proxy-api:/root/.cli-proxy-api:rw
      - /home/Docker/CLIProxyAPI/plugins:/CLIProxyAPI/plugins:rw
      - /home/Docker/CLIProxyAPI/logs:/CLIProxyAPI/logs:rw
      - /home/Docker/CLIProxyAPI/opencodex:/data/opencodex:rw
      # >>> VAST CLUSTER BENCH: mount nguyên thư mục tunnel (thêm dòng này) <<<
      #     plugin tự dò instances.txt + ssh/id_ed25519 bên trong
      - /home/Docker/vast-tunnel:/vast-tunnel:ro
